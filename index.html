<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git digestif</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0; padding: 0;
      line-height: 1.6; color: #ddd; background: #1a1210;
      display: flex; height: 100vh;
    }

    /* --- sidebar --- */
    #sidebar {
      width: 220px; min-width: 180px;
      background: #140e0c; border-right: 1px solid #3a1a14;
      overflow-y: auto; padding: 0.5em 0;
      flex-shrink: 0;
    }
    #sidebar ul { list-style: none; margin: 0; padding: 0; }
    #sidebar li { user-select: none; }
    #sidebar li > span {
      display: block; padding: 0.2em 0.6em;
      cursor: pointer; white-space: nowrap;
    }
    #sidebar li > span:hover { background: #2a1a14; }
    #sidebar li > span.loading { color: #999; font-style: italic; }
    #sidebar li > ul { padding-left: 1em; display: none; }
    #sidebar li.expanded > ul { display: block; }
    #sidebar li > span::before {
      content: '▸ '; color: #f03c2e; font-size: 0.8em;
    }
    #sidebar li.expanded > span::before { content: '▾ '; }
    #sidebar li.leaf > span::before { content: '  '; }

    /* --- content pane --- */
    #main {
      flex: 1; overflow-y: auto; padding: 2em;
      max-width: 52em;
    }
    #content { }
    h1, h2, h3, h4, h5, h6 {
      border: 1px solid #3a1a14; border-radius: 8px;
      padding: 0.4em 0.7em; margin-top: 1.5em; color: #e2e2e2;
    }
    h1 { background: #2a1410; border-left: 4px solid #f03c2e; }
    h2 { background: #241210; border-left: 4px solid #e8674a; }
    h3 { background: #201210; border-left: 4px solid #d4896a; }
    h4 { background: #1e1210; border-left: 4px solid #c4a080; }
    h5 { background: #1c1210; border-left: 4px solid #b0a090; }
    h6 { background: #1a1210; border-left: 4px solid #999; }
    a { color: #e8674a; }
    a:hover { color: #f03c2e; }
    pre, code { font-family: Consolas, "Liberation Mono", Menlo, monospace; }
    pre { background: #120c08; padding: 1em; overflow-x: auto; border-radius: 6px; }
    code { background: #2a1a14; padding: 0.15em 0.3em; border-radius: 3px; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #f03c2e; margin-left: 0; padding-left: 1em; color: #999; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #3a1a14; padding: 0.4em 0.8em; text-align: left; }
    th { background: #2a1410; color: #f03c2e; }
    tr:nth-child(even) { background: #1e1410; }
    tr:hover { background: #2a1a14; }
    hr { border: none; border-top: 1px solid #3a1a14; margin: 2em 0; }
    #error { color: #f03c2e; padding: 1em; }
  </style>
</head>
<body>
  <nav id="sidebar"><ul id="tree"></ul></nav>
  <div id="main">
    <div id="content">Select an entry from the tree.</div>
    <div id="error"></div>
  </div>
  <script>
    const OWNER = 'dscho';
    const REPO  = 'lore-git-md';
    const API   = 'https://api.github.com';

    let rootTreeSha = null;

    const DIGEST_FILES = [
      'digest.human.md',
      'digest.weekly.human.md',
      'digest.monthly.human.md'
    ];

    const DIGEST_LABELS = {
      'digest.human.md':          'Daily digest',
      'digest.weekly.human.md':   'Weekly digest',
      'digest.monthly.human.md':  'Monthly digest'
    };

    // Low-level GitHub API GET returning a promise of the response text.
    function apiGet(path, accept) {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', API + path);
        xhr.setRequestHeader('Accept', accept || 'application/vnd.github+json');
        xhr.onload = function () {
          if (xhr.status === 200) resolve(xhr.responseText);
          else reject(new Error('GitHub API ' + xhr.status + ': ' + xhr.responseText));
        };
        xhr.onerror = function () { reject(new Error('Network error')); };
        xhr.send();
      });
    }

    var repoPrefix = '/repos/' + OWNER + '/' + REPO;

    // Reusable: get tree entries for any tree SHA (cache-first).
    // Returns an array of { path, type, sha } objects.
    function getTreeEntries(treeSha) {
      return apiGet(repoPrefix + '/git/trees/' + treeSha).then(function (text) {
        return JSON.parse(text).tree.map(function (e) {
          return { path: e.path, type: e.type, sha: e.sha };
        });
      });
    }

    // Resolve the default branch's root tree SHA.
    function fetchRootTree() {
      return apiGet(repoPrefix + '/branches/main').then(function (text) {
        return JSON.parse(text).commit.commit.tree.sha;
      });
    }

    // Build a <li> for one tree entry and wire up expand/collapse.
    // Blob entries that are not digest files are skipped (returns null).
    function createTreeNode(entry) {
      if (entry.type === 'blob' && DIGEST_FILES.indexOf(entry.path) === -1) return null;

      const li = document.createElement('li');
      const span = document.createElement('span');

      if (entry.type === 'tree') {
        span.textContent = entry.path;
        li.appendChild(span);
        const childUl = document.createElement('ul');
        li.appendChild(childUl);
        let loaded = false;

        span.addEventListener('click', function () {
          if (li.classList.contains('expanded')) {
            li.classList.remove('expanded');
            return;
          }
          li.classList.add('expanded');
          if (loaded) return;
          span.classList.add('loading');
          getTreeEntries(entry.sha).then(function (children) {
            children.forEach(function (child) {
              const node = createTreeNode(child);
              if (node) childUl.appendChild(node);
            });
            loaded = true;
          }).catch(function (err) {
            const errLi = document.createElement('li');
            errLi.classList.add('leaf');
            errLi.innerHTML = '<span style="color:#f03c2e">' + err.message + '</span>';
            childUl.appendChild(errLi);
          }).finally(function () {
            span.classList.remove('loading');
          });
        });
      } else {
        li.classList.add('leaf');
        span.textContent = DIGEST_LABELS[entry.path] || entry.path;
        span.addEventListener('click', function () {
          loadBlob(entry.sha, span.textContent);
        });
        li.appendChild(span);
      }
      return li;
    }

    // Load and render a blob as Markdown.
    function loadBlob(sha, name) {
      const content = document.getElementById('content');
      content.textContent = 'Loading ' + name + '…';
      apiGet(repoPrefix + '/git/blobs/' + sha, 'application/vnd.github.raw+json').then(function (text) {
        content.innerHTML = marked.parse(text);
      }).catch(function (err) {
        content.textContent = err.message;
      });
    }

    // --- boot ---
    (function init() {
      fetchRootTree().then(function (sha) {
        rootTreeSha = sha;
        return getTreeEntries(sha);
      }).then(function (entries) {
        const tree = document.getElementById('tree');
        entries.forEach(function (entry) {
          const node = createTreeNode(entry);
          if (node) tree.appendChild(node);
        });
      }).catch(function (err) {
        document.getElementById('error').textContent = err.message;
      });
    })();
  </script>
</body>
</html>
