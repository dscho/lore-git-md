<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git digestif</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0; padding: 0;
      line-height: 1.6; color: #ddd; background: #3d1e12;
      display: flex; height: 100vh;
    }

    /* --- sidebar --- */
    #sidebar {
      width: 220px; min-width: 180px;
      background: #301810; border-right: 1px solid #5a3020;
      padding: 0;
      flex-shrink: 0;
      display: flex; flex-direction: column;
    }

    /* --- drum rollers --- */
    .roller {
      height: 9em; position: relative; overflow: hidden;
      text-align: center; flex-shrink: 0;
      border-bottom: 1px solid #5a3020;
      cursor: ns-resize;
    }
    .roller-highlight {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 1.8em; transform: translateY(-50%);
      background: rgba(240, 60, 46, 0.08);
      border-top: 1px solid rgba(240, 60, 46, 0.25);
      border-bottom: 1px solid rgba(240, 60, 46, 0.25);
      pointer-events: none;
    }
    .roller-items {
      position: absolute; left: 0; right: 0;
      transition: top 0.2s ease;
    }
    .roller-item {
      height: 1.8em; line-height: 1.8em;
      display: flex; align-items: center; justify-content: center; gap: 0.3em;
      cursor: pointer; color: #ddd;
      transition: opacity 0.2s, transform 0.2s;
    }
    .roller-item.selected { font-weight: bold; color: #f03c2e; }

    /* --- digest pill buttons --- */
    .digest-btn {
      display: inline-block; font-size: 0.65em; line-height: 1;
      padding: 0.15em 0.45em; margin-left: 0.3em;
      border-radius: 3px; border: 1px solid #f03c2e;
      color: #f03c2e; background: transparent;
      cursor: pointer; vertical-align: middle;
      font-style: normal;
    }
    .digest-btn:hover { background: #f03c2e; color: #1c1510; }
    .digest-btn.weekly { border-color: #e8674a; color: #e8674a; }
    .digest-btn.weekly:hover { background: #e8674a; color: #1c1510; }
    .digest-btn.monthly { border-color: #d4896a; color: #d4896a; }
    .digest-btn.monthly:hover { background: #d4896a; color: #1c1510; }

    /* --- content pane --- */
    #main {
      flex: 1; overflow-y: auto; padding: 2em;
      max-width: 52em;
      background: radial-gradient(ellipse at 50% 40%, #4a2818 0%, transparent 70%);
    }
    #content { }
    h1, h2, h3, h4, h5, h6 {
      border: 1px solid #3c2418; border-radius: 8px;
      padding: 0.4em 0.7em; margin-top: 1.5em; color: #e2e2e2;
    }
    h1 { background: #2c1c14; border-left: 4px solid #f03c2e; }
    h2 { background: #281a14; border-left: 4px solid #e8674a; }
    h3 { background: #241812; border-left: 4px solid #d4896a; }
    h4 { background: #221612; border-left: 4px solid #c4a080; }
    h5 { background: #201510; border-left: 4px solid #b0a090; }
    h6 { background: #1c1510; border-left: 4px solid #999; }
    a { color: #e8674a; }
    a:hover { color: #f03c2e; }
    pre, code { font-family: Consolas, "Liberation Mono", Menlo, monospace; }
    pre { background: #140f0a; padding: 1em; overflow-x: auto; border-radius: 6px; }
    code { background: #2e2014; padding: 0.15em 0.3em; border-radius: 3px; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #f03c2e; margin-left: 0; padding-left: 1em; color: #999; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #3c2418; padding: 0.4em 0.8em; text-align: left; }
    th { background: #2c1c14; color: #f03c2e; }
    tr:nth-child(even) { background: #221812; }
    tr:hover { background: #2e2014; }
    hr { border: none; border-top: 1px solid #3c2418; margin: 2em 0; }
    #error { color: #f03c2e; padding: 1em; }
  </style>
</head>
<body>
  <nav id="sidebar">
    <div class="roller" id="year-roller">
      <div class="roller-highlight"></div>
      <div class="roller-items"></div>
    </div>
    <div class="roller" id="month-roller">
      <div class="roller-highlight"></div>
      <div class="roller-items"></div>
    </div>
    <div class="roller" id="day-roller">
      <div class="roller-highlight"></div>
      <div class="roller-items"></div>
    </div>
  </nav>
  <div id="main">
    <div id="content">Select an entry from the tree.</div>
    <div id="error"></div>
  </div>
  <script>
    const OWNER = 'dscho';
    const REPO  = 'lore-git-md';
    const API   = 'https://api.github.com';

    let rootTreeSha = null;
    const treeCache = {};

    const DIGEST_FILES = [
      'digest.human.md',
      'digest.weekly.human.md',
      'digest.monthly.human.md'
    ];

    const DIGEST_LABELS = {
      'digest.human.md':          'day',
      'digest.weekly.human.md':   'week',
      'digest.monthly.human.md':  'month'
    };

    // Low-level GitHub API GET returning a promise of the response text.
    function apiGet(path, accept) {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', API + path);
        xhr.setRequestHeader('Accept', accept || 'application/vnd.github+json');
        xhr.onload = function () {
          if (xhr.status === 200) resolve(xhr.responseText);
          else reject(new Error('GitHub API ' + xhr.status + ': ' + xhr.responseText));
        };
        xhr.onerror = function () { reject(new Error('Network error')); };
        xhr.send();
      });
    }

    var repoPrefix = '/repos/' + OWNER + '/' + REPO;

    // Reusable: get tree entries for any tree SHA (cache-first).
    // Caches the promise itself, so concurrent calls for the same SHA share one request.
    function getTreeEntries(treeSha, skipCache) {
      if (!skipCache && treeCache[treeSha]) {
        return treeCache[treeSha];
      }
      var p = apiGet(repoPrefix + '/git/trees/' + treeSha).then(function (text) {
        return JSON.parse(text).tree.map(function (e) {
          return { path: e.path, type: e.type, sha: e.sha };
        }).reverse();
      });
      if (!skipCache) treeCache[treeSha] = p;
      return p;
    }

    // Resolve the default branch's root tree SHA.
    function fetchRootTree() {
      return apiGet(repoPrefix + '/branches/main').then(function (text) {
        return JSON.parse(text).commit.commit.tree.sha;
      });
    }

    function makeDigestBtn(blobEntry) {
      const btn = document.createElement('button');
      btn.className = 'digest-btn';
      if (blobEntry.path === 'digest.weekly.human.md') btn.classList.add('weekly');
      if (blobEntry.path === 'digest.monthly.human.md') btn.classList.add('monthly');
      btn.textContent = DIGEST_LABELS[blobEntry.path];
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        loadBlob(blobEntry.sha, DIGEST_LABELS[blobEntry.path]);
      });
      return btn;
    }

    // --- generic drum roller ---
    function Roller(el) {
      this.el = el;
      this.itemsEl = el.querySelector('.roller-items');
      this.entries = [];
      this.selectedIndex = 0;
      this.onSelect = null;
      this.digestLoader = null;
      this._wheelCooldown = false;
      var self = this;
      el.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (self._wheelCooldown) return;
        var idx = self.selectedIndex + (e.deltaY > 0 ? 1 : -1);
        if (idx >= 0 && idx < self.entries.length) {
          self.selectedIndex = idx;
          self.refresh();
          if (self.onSelect) self.onSelect(self.entries[idx], idx);
          self._wheelCooldown = true;
          setTimeout(function () { self._wheelCooldown = false; }, 150);
        }
      }, { passive: false });
    }

    Roller.prototype.setEntries = function (entries) {
      this.entries = entries;
      this.selectedIndex = 0;
      this.render();
      if (this.onSelect) this.onSelect(entries.length > 0 ? entries[0] : null, 0);
    };

    Roller.prototype.render = function () {
      var self = this;
      this.itemsEl.innerHTML = '';
      this.entries.forEach(function (entry, idx) {
        var div = document.createElement('div');
        div.className = 'roller-item';
        var label = document.createElement('span');
        label.textContent = entry.path;
        div.appendChild(label);
        div.addEventListener('click', function () {
          self.selectedIndex = idx;
          self.refresh();
          if (self.onSelect) self.onSelect(self.entries[idx], idx);
        });
        self.itemsEl.appendChild(div);
      });
      this.refresh();
    };

    var FADE = [
      { opacity: 1,    scale: 1 },
      { opacity: 0.55, scale: 0.85 },
      { opacity: 0.2,  scale: 0.65 }
    ];

    Roller.prototype.refresh = function () {
      var items = this.itemsEl.children;
      for (var i = 0; i < items.length; i++) {
        var offset = Math.abs(i - this.selectedIndex);
        var f = FADE[Math.min(offset, 2)];
        var vis = offset <= 2 ? f.opacity : 0;
        items[i].style.opacity = vis;
        items[i].style.transform = 'scale(' + (offset <= 2 ? f.scale : 0.5) + ')';
        items[i].classList.toggle('selected', i === this.selectedIndex);
      }
      this.itemsEl.style.top = (4.5 - this.selectedIndex * 1.8 - 0.9) + 'em';
      this._loadVisibleDigests();
    };

    Roller.prototype.clear = function () {
      this.entries = [];
      this.selectedIndex = 0;
      this.itemsEl.innerHTML = '';
    };

    // Load digests only for the 5 visible items (selected ±2).
    Roller.prototype._loadVisibleDigests = function () {
      if (!this.digestLoader) return;
      var self = this;
      var lo = Math.max(0, this.selectedIndex - 2);
      var hi = Math.min(this.entries.length - 1, this.selectedIndex + 2);
      for (var i = lo; i <= hi; i++) {
        (function (idx) {
          var item = self.itemsEl.children[idx];
          if (!item || item._digestsLoaded) return;
          item._digestsLoaded = true;
          self.digestLoader(self.entries[idx]).then(function (digests) {
            digests.forEach(function (d) { item.appendChild(makeDigestBtn(d)); });
          });
        })(i);
      }
    };

    // --- roller instances and cascade ---
    var yearRoller  = new Roller(document.getElementById('year-roller'));
    var monthRoller = new Roller(document.getElementById('month-roller'));
    var dayRoller   = new Roller(document.getElementById('day-roller'));

    function makeMonthDigestLoader() {
      return function (month) {
        return getTreeEntries(month.sha).then(function (mc) {
          return mc.filter(function (c) {
            return c.type === 'blob' && c.path === 'digest.monthly.human.md';
          });
        });
      };
    }

    function makeDayDigestLoader(isLatest) {
      return function (day) {
        return getTreeEntries(day.sha, isLatest).then(function (dc) {
          return dc.filter(function (c) {
            return c.type === 'blob' && DIGEST_FILES.indexOf(c.path) !== -1;
          });
        });
      };
    }

    function isLatestSelection() {
      return yearRoller.selectedIndex === 0 && monthRoller.selectedIndex === 0;
    }

    yearRoller.onSelect = function (entry) {
      monthRoller.clear();
      dayRoller.clear();
      if (!entry) return;
      getTreeEntries(entry.sha).then(function (children) {
        var months = children.filter(function (c) { return c.type === 'tree'; });
        monthRoller.digestLoader = makeMonthDigestLoader();
        monthRoller.setEntries(months);
      }).catch(showError);
    };

    monthRoller.onSelect = function (entry) {
      dayRoller.clear();
      if (!entry) return;
      var isLatest = isLatestSelection();
      getTreeEntries(entry.sha, isLatest).then(function (children) {
        var days = children.filter(function (c) { return c.type === 'tree'; });
        dayRoller.digestLoader = makeDayDigestLoader(isLatest);
        dayRoller.setEntries(days);
      }).catch(showError);
    };

    dayRoller.onSelect = function () {};

    function showError(err) {
      document.getElementById('error').textContent = err.message;
    }

    // Load and render a blob as Markdown.
    function loadBlob(sha, name) {
      const content = document.getElementById('content');
      content.textContent = 'Loading ' + name + '…';
      apiGet(repoPrefix + '/git/blobs/' + sha, 'application/vnd.github.raw+json').then(function (text) {
        content.innerHTML = marked.parse(text);
      }).catch(function (err) {
        content.textContent = err.message;
      });
    }

    // --- boot ---
    (function init() {
      fetchRootTree().then(function (sha) {
        rootTreeSha = sha;
        return getTreeEntries(sha);
      }).then(function (entries) {
        yearRoller.setEntries(entries.filter(function (e) { return e.type === 'tree'; }));
      }).catch(function (err) {
        document.getElementById('error').textContent = err.message;
      });
    })();
  </script>
</body>
</html>
